name: Daily rollover

# Clears the board and rebuilds it from the saved tasks flagged for auto-add.
#
# The schedule itself lives in data.json and is edited in the admin panel, NOT
# here. GitHub cron only understands UTC, so a time set here would drift by an
# hour at each daylight-saving change; the script compares wall-clock time in
# the board's own timezone instead. The cron below is only a heartbeat — it asks
# "is anything due?" and almost always answers no.
#
# Deliberately no `schedule:` trigger yet. Run this by hand from the Actions tab
# a couple of times first; the cron line goes in once it's proven.

on:
  # Twice an hour, deliberately off the hour: GitHub's queue peaks at :00 and
  # delayed runs are commonest there. Each tick just asks "is anything due?"
  # and almost always answers no, which costs one API call and no commit.
  #
  # This is only a heartbeat. The actual time, days and timezone live in
  # data.json and are edited in Quick add — see the README.
  schedule:
    - cron: "13,43 * * * *"

  workflow_dispatch:
    inputs:
      force:
        description: "Roll over now, ignoring the schedule"
        type: boolean
        default: false
      dry_run:
        description: "Decide and print, but write nothing"
        type: boolean
        default: false

# The job commits data.json through the Contents API. Requires
# Settings → Actions → Workflow permissions → "Read and write permissions".
permissions:
  contents: write

# Heartbeats must never overlap. They'd be safe if they did — the script
# re-reads and re-decides on a write conflict — but queueing is cheaper than
# discovering that.
concurrency:
  group: rollover
  cancel-in-progress: false

jobs:
  rollover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Plain checkout: the script needs rollover-core.js and config.js from the
      # repo root. data.json comes down too, but is never read from disk — all
      # board access goes through the Contents API so the sha gives us
      # compare-and-swap against whatever browsers are doing at the same moment.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # No actions/setup-node: ubuntu-latest ships Node 20+, and the script uses
      # nothing beyond global fetch and full-ICU Intl.
      - name: Roll the board over
        run: node .github/scripts/rollover.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
